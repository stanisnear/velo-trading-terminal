[profile.default]
src         = "src"
out         = "out"
libs        = ["lib"]
test        = "test"
script      = "script"
solc        = "0.8.22"
optimizer   = true
optimizer_runs = 200
via_ir      = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@layerzerolabs/oapp-evm/=lib/devtools/packages/oapp-evm/",
  "@layerzerolabs/oft-evm/=lib/devtools/packages/oft-evm/",
  "@layerzerolabs/lz-evm-protocol-v2/=lib/layerzero-v2/packages/layerzero-v2/evm/protocol/",
  "@layerzerolabs/lz-evm-messagelib-v2/=lib/layerzero-v2/packages/layerzero-v2/evm/messagelib/",
  "@layerzerolabs/lz-evm-oapp-v2/=lib/layerzero-v2/packages/layerzero-v2/evm/oapp/",
  "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
  "forge-std/=lib/forge-std/src/",
  "solidity-bytes-utils/=lib/solidity-bytes-utils/contracts/"
]

[rpc_endpoints]
base_sepolia      = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia  = "${ARB_SEPOLIA_RPC_URL}"
optimism_sepolia  = "${OP_SEPOLIA_RPC_URL}"
ethereum_sepolia  = "${ETH_SEPOLIA_RPC_URL}"

# Etherscan V2 — one API key works for all chains.
# Find your key at https://etherscan.io/myapikey
[etherscan]
base_sepolia      = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api",            chain = 84532 }
arbitrum_sepolia  = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api",             chain = 421614 }
optimism_sepolia  = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia-optimistic.etherscan.io/api", chain = 11155420 }
ethereum_sepolia  = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api",            chain = 11155111 }
