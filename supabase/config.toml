project_id = "velo-trading-terminal"

[functions.velo-api]
enabled = true
entrypoint = "./functions/velo-api/bundle.js"
# The bridge validates X-Velo-Proxy-Token before loading/executing a handler.
# Validates the explicit secret or reviewed SHA-256 token verifier. Fails closed.
verify_jwt = false

[functions.velo-keepers]
enabled = true
entrypoint = "./functions/velo-keepers/bundle.js"
# Mandatory Bearer CRON_SECRET auth is implemented before executing any job.
verify_jwt = false
