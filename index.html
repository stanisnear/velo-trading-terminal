    <script>
      (function() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const stops = [
          [0, '#45664f'],
          [0.35, '#789b82'],
          [0.7, '#a9cbb3'],
          [1, '#e0eee3'],
        ];
        function draw() {
          ctx.clearRect(0, 0, 64, 64);
          // Rounded rect clip
          const r = 16;
          ctx.beginPath();
          ctx.moveTo(r, 0); ctx.lineTo(64-r, 0);
          ctx.quadraticCurveTo(64, 0, 64, r);
          ctx.lineTo(64, 64-r); ctx.quadraticCurveTo(64, 64, 64-r, 64);
          ctx.lineTo(r, 64); ctx.quadraticCurveTo(0, 64, 0, 64-r);
          ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.save(); ctx.clip();
          // Animated gradient
          const grad = ctx.createLinearGradient(0, 0, 64, 64);
          stops.forEach(([pos, color]) => {
            grad.addColorStop(pos, color);
          });
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 64, 64);
          // Glass highlight
          const highlight = ctx.createRadialGradient(20, 10, 0, 20, 10, 50);
          highlight.addColorStop(0, 'rgba(255,255,255,0.45)');
          highlight.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = highlight;
          ctx.fillRect(0, 0, 64, 64);
          ctx.restore();
          // V letter
          ctx.fillStyle = '#f1f5f1';
          ctx.font = 'italic 400 38px "Fraunces", Georgia, serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('V', 32, 35);
          // Update favicon
          let link = document.querySelector("link[rel~='icon']");
          if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
          link.href = canvas.toDataURL('image/png');
        }
        function tick() { draw(); }
        // Wait for fonts if possible
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(tick);
        } else {
          tick();
        }
      })();
    </script>

              glass: { light: 'rgba(255,255,255,0.60)', dark: 'rgba(20,27,23,0.70)', border: 'rgba(223,239,227,0.14)' },
            },
            animation: {
              'holo': 'holoSlide 9s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'slide-in': 'slideIn 0.3s ease-out forwards',
              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'bounce-in': 'bounceIn 0.35s ease-out',
              'float-up': 'floatUp 0.5s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              holoSlide: { '0%': { backgroundPosition: '0% 50%' }, '100%': { backgroundPosition: '200% 50%' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              slideIn: { '0%': { opacity: '0', transform: 'translateX(20px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              bounceIn: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '50%': { transform: 'scale(1.02)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              floatUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },

    <style>
      :root {
        --font-display: "Fraunces", ui-serif, Georgia, serif;
        --font-sans: "Satoshi", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --iris-violet: #91b99f; --iris-magenta: #b4d5bf;
        --iris-coral: #df7774; --iris-amber: #d6b77f;
        --iris-lime: #77c995; --iris-cyan: #dce9df;
        --iris-blue: #557a64;
        --pnl-up: #77c995; --pnl-down: #df7774;
        --holo-linear: linear-gradient(135deg, #557a64 0%, #91b99f 52%, #dce9df 100%);
        --hairline: rgba(224,238,228,0.09); --hairline-strong: rgba(224,238,228,0.16);

      body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; background-attachment: fixed; }
      html.dark body { background-color: #0a0e0c; background-image: none; }
      html.light body { background-color: #e7eee8; background-image: none; }

      .glass-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(22px) saturate(1.08); -webkit-backdrop-filter: blur(22px) saturate(1.08); box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 18px 40px -24px rgba(0,0,0,0.26); position: relative; }
      html.light .glass-panel { box-shadow: 0 1px 0 rgba(250,255,250,0.45) inset, 0 18px 40px -28px rgba(35,61,41,0.16); }
      .glass-panel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0.025), transparent 42%); z-index: 0; }
      .glass-panel > * { position: relative; z-index: 1; }

      .glass-input { background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); outline: none; transition: all 0.2s; }
      .glass-input:focus { border-color: var(--iris-violet); box-shadow: 0 0 0 2px rgba(145,185,159,0.18); }
      html.light .glass-input { background: rgba(10,10,14,0.03); }

      .holo-text { background: var(--holo-linear); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: holoSlide 9s linear infinite; }
      @keyframes holoSlide { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

      .velo-logo-bug { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: linear-gradient(155deg, #33463a, #17221b); position: relative; box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 8px 20px -8px rgba(30,55,38,0.5); }
      .velo-logo-bug::before { content: ""; position: absolute; inset: 1px; border-radius: 11px; background: radial-gradient(120% 80% at 30% 10%, rgba(255,255,255,0.45), rgba(255,255,255,0) 60%); pointer-events: none; }

      .tnum { font-feature-settings: "tnum" 1, "ss01" 1; font-variant-numeric: tabular-nums; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156,163,175,0.3); border-radius: 2px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .pnl-up { color: var(--pnl-up); }
      .pnl-down { color: var(--pnl-down); }

      /* Mobile navbar: flush to top, grows to absorb safe-area (status bar) */
      @media (max-width: 1023px) {
        .navbar-mobile-flush {
          top: 0 !important;
          left: 0 !important;
          right: 0 !important;
          transform: none !important;
          width: 100% !important;
          max-width: 100% !important;
          border-radius: 0 0 20px 20px !important;
          border-top: none !important;
          border-left: none !important;
          border-right: none !important;
          /* bar grows to include the status bar inset */
          height: calc(60px + env(safe-area-inset-top, 0px)) !important;
          padding-left: 14px !important;
          padding-right: 14px !important;
          padding-top: env(safe-area-inset-top, 0px) !important;
          padding-bottom: 0 !important;
          /* push grid content below the status bar */
          align-items: center !important;
        }
        /* Main content must clear the taller mobile navbar */
        .velo-main {
          padding-top: calc(60px + env(safe-area-inset-top, 0px) + 8px) !important;
        }
        .velo-main.trade-view {
          padding-top: calc(60px + env(safe-area-inset-top, 0px)) !important;

    <script>
      // Global fallback for broken avatar/image URLs — replace with DiceBear placeholder
      document.addEventListener('error', function(e) {
        const t = e.target;
        if (t && t.tagName === 'IMG' && !t.dataset.errored) {
          t.dataset.errored = '1';
          const seed = t.alt || t.src || 'default';
          t.src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(seed);
        }
      }, true);
    </script>

    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[VELO PWA] SW registered:', reg.scope);
              // Force an immediate update check so a new SW (e.g. the v3
              // network-first fix) replaces a stale one without waiting.
              reg.update();
            })
            .catch(err => console.warn('[VELO PWA] SW registration failed:', err));

          // When a new service worker takes control, reload ONCE so the page
          // runs against the freshest code instead of stale cached handlers.
          // This is what prevents the "buttons dead until I clear cache" state.
          let reloadedForSW = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedForSW) return;
            reloadedForSW = true;
            window.location.reload();
          });
        });
      }

      // PWA install prompt — store for later use by the app
      window.__veloInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__veloInstallPrompt = e;
        // Dispatch custom event so React can pick it up
        window.dispatchEvent(new CustomEvent('velo:installable'));
      });
      window.addEventListener('appinstalled', () => {
        window.__veloInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('velo:installed'));
      });
    </script>
