    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%237c3aed' rx='24' width='100' height='100'/><text x='50' y='68' font-size='50' fill='white' text-anchor='middle' font-weight='400' font-style='italic' font-family='serif'>V</text></svg>" />
    <script>
      (function() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        let hue = 0;
        const stops = [
          [0,   270], // violet
          [0.2, 320], // magenta
          [0.4, 25],  // coral
          [0.6, 60],  // amber
          [0.75,125], // lime
          [0.9, 200], // cyan
          [1.0, 250], // blue
        ];
        function draw() {
          ctx.clearRect(0, 0, 64, 64);
          // Rounded rect clip
          const r = 16;
          ctx.beginPath();
          ctx.moveTo(r, 0); ctx.lineTo(64-r, 0);
          ctx.quadraticCurveTo(64, 0, 64, r);
          ctx.lineTo(64, 64-r); ctx.quadraticCurveTo(64, 64, 64-r, 64);
          ctx.lineTo(r, 64); ctx.quadraticCurveTo(0, 64, 0, 64-r);
          ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.save(); ctx.clip();
          // Animated gradient
          const grad = ctx.createLinearGradient(0, 0, 64, 64);
          stops.forEach(([pos, baseHue]) => {
            const h = ((baseHue + hue) % 360 + 360) % 360;
            grad.addColorStop(pos, `hsl(${h}, 85%, 62%)`);
          });
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 64, 64);
          // Glass highlight
          const highlight = ctx.createRadialGradient(20, 10, 0, 20, 10, 50);
          highlight.addColorStop(0, 'rgba(255,255,255,0.45)');
          highlight.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = highlight;
          ctx.fillRect(0, 0, 64, 64);
          ctx.restore();
          // V letter
          ctx.fillStyle = 'rgba(8,8,12,0.88)';
          ctx.font = 'italic 400 38px "Instrument Serif", Georgia, serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('V', 32, 35);
          // Update favicon
          let link = document.querySelector("link[rel~='icon']");
          if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
          link.href = canvas.toDataURL('image/png');
        }
        function tick() { hue = (hue + 0.4) % 360; draw(); requestAnimationFrame(tick); }
        // Wait for fonts if possible
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(tick);
        } else {
          tick();
        }
      })();
    </script>

              sans: ['"Inter Tight"', '"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],

            colors: {
              velo: { bg: '#07070A', bg2: '#0E0E13', surface: '#121218', fg: '#F4F4F7', muted: '#9A9AA4', subtle: '#56565F' },
              iris: { violet: '#8b5cf6', magenta: '#d946ef', coral: '#f97316', amber: '#eab308', lime: '#84cc16', cyan: '#22d3ee', blue: '#6366f1' },
              pnl: { up: '#4ade80', down: '#f87171' },
              glass: { light: 'rgba(255,255,255,0.58)', dark: 'rgba(22,22,28,0.55)', border: 'rgba(255,255,255,0.08)' },
            },
            animation: {
              'holo': 'holoSlide 9s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'slide-in': 'slideIn 0.3s ease-out forwards',
              'fade-in': 'fadeIn 0.2s ease-out forwards',
              'bounce-in': 'bounceIn 0.35s ease-out',
              'float-up': 'floatUp 0.5s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              holoSlide: { '0%': { backgroundPosition: '0% 50%' }, '100%': { backgroundPosition: '200% 50%' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
              slideIn: { '0%': { opacity: '0', transform: 'translateX(20px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              bounceIn: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '50%': { transform: 'scale(1.02)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              floatUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --font-display: "Instrument Serif", ui-serif, Georgia, serif;
        --font-sans: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --iris-violet: oklch(0.68 0.22 295); --iris-magenta: oklch(0.70 0.22 340);
        --iris-coral: oklch(0.74 0.18 30); --iris-amber: oklch(0.82 0.16 75);
        --iris-lime: oklch(0.84 0.18 130); --iris-cyan: oklch(0.80 0.14 205);
        --iris-blue: oklch(0.68 0.18 250);
        --pnl-up: oklch(0.78 0.18 150); --pnl-down: oklch(0.66 0.22 25);
        --holo-linear: linear-gradient(100deg, var(--iris-violet) 0%, var(--iris-magenta) 22%, var(--iris-coral) 42%, var(--iris-amber) 58%, var(--iris-lime) 74%, var(--iris-cyan) 90%, var(--iris-blue) 100%);
        --hairline: rgba(255,255,255,0.06); --hairline-strong: rgba(255,255,255,0.12);
        --glass-bg: rgba(22,22,28,0.55); --glass-bg-strong: rgba(22,22,28,0.82);
        --glass-border: rgba(255,255,255,0.08);
      }
      html.light { --hairline: rgba(10,10,14,0.08); --hairline-strong: rgba(10,10,14,0.14); --glass-bg: rgba(255,255,255,0.58); --glass-bg-strong: rgba(255,255,255,0.78); --glass-border: rgba(255,255,255,0.9); }

      body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; background-attachment: fixed; }
      html.dark body { background-color: #07070A; background-image: radial-gradient(at 12% 8%, oklch(0.55 0.22 295 / 0.18) 0px, transparent 40%), radial-gradient(at 88% 4%, oklch(0.55 0.18 205 / 0.14) 0px, transparent 45%), radial-gradient(at 92% 92%, oklch(0.60 0.18 130 / 0.12) 0px, transparent 45%), radial-gradient(at 4% 96%, oklch(0.55 0.22 340 / 0.14) 0px, transparent 45%); }
      html.light body { background-color: #F5F3EE; background-image: radial-gradient(at 12% 8%, oklch(0.88 0.10 295 / 0.45) 0px, transparent 40%), radial-gradient(at 88% 4%, oklch(0.90 0.08 205 / 0.45) 0px, transparent 45%), radial-gradient(at 92% 92%, oklch(0.90 0.09 130 / 0.45) 0px, transparent 45%), radial-gradient(at 4% 96%, oklch(0.90 0.10 340 / 0.40) 0px, transparent 45%); }

      .glass-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 -1px 0 rgba(0,0,0,0.2) inset, 0 24px 48px -20px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.15); position: relative; }
      html.light .glass-panel { box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 -1px 0 rgba(10,10,14,0.04) inset, 0 18px 40px -20px rgba(10,10,14,0.2), 0 2px 6px rgba(10,10,14,0.05); }
      .glass-panel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 40%); z-index: 0; }
      .glass-panel > * { position: relative; z-index: 1; }

      .glass-input { background: rgba(255,255,255,0.03); border: 1px solid var(--hairline); outline: none; transition: all 0.2s; }
      .glass-input:focus { border-color: var(--iris-violet); box-shadow: 0 0 0 2px oklch(0.68 0.22 295 / 0.15); }
      html.light .glass-input { background: rgba(10,10,14,0.03); }

      .holo-text { background: var(--holo-linear); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: holoSlide 9s linear infinite; }
      @keyframes holoSlide { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

      .velo-logo-bug { display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--holo-linear); background-size: 220% 100%; animation: holoSlide 9s linear infinite; position: relative; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 -1px 0 rgba(0,0,0,0.15) inset, 0 8px 20px -8px oklch(0.68 0.22 295 / 0.5); }
      .velo-logo-bug::before { content: ""; position: absolute; inset: 1px; border-radius: 11px; background: radial-gradient(120% 80% at 30% 10%, rgba(255,255,255,0.45), rgba(255,255,255,0) 60%); pointer-events: none; }

      .tnum { font-feature-settings: "tnum" 1, "ss01" 1; font-variant-numeric: tabular-nums; }

      .no-scrollbar::-webkit-scrollbar { display: none; }

    <script>
      // Global fallback for broken avatar/image URLs — replace with DiceBear placeholder
      document.addEventListener('error', function(e) {
        const t = e.target;
        if (t && t.tagName === 'IMG' && !t.dataset.errored) {
          t.dataset.errored = '1';
          const seed = t.alt || t.src || 'default';
          t.src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(seed);
        }
      }, true);
    </script>
